services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: delay-plan-compiler:latest
    environment:
      # Host port to bind inside the container; the published host port is
      # controlled below with the same variable (defaults to 8080).
      API_PORT: ${API_PORT:-8080}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${API_PORT:-8080}:${API_PORT:-8080}"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,urllib.request as u; sys.exit(0 if u.urlopen('http://127.0.0.1:%s/healthz' % os.environ['API_PORT'], timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  # One-shot verification job: summarizes code tests, image build artifacts
  # and an end-to-end API smoke against the api service; exits non-zero if
  # any check group fails.  Run with: docker compose --profile verify run --rm verify
  verify:
    profiles: ["verify"]
    image: delay-plan-compiler:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_BASE_URL: http://api:${API_PORT:-8080}
      LOG_LEVEL: INFO
    entrypoint: ["python", "scripts/verify.py"]
    restart: "no"
